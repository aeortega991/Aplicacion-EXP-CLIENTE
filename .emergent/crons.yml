crons:
  - name: route-reminder
    description: "Recuerda a todos los usuarios registrar su ruta recorrida, de lunes a sabado a las 18:00 (hora Ecuador)"
    cron: "0 18 * * 1-6"
    timezone: "America/Guayaquil"
    endpoint: "{{BASE_URL}}/api/cron/route-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
